<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CX Support SOP Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --navy: #1B3A5C;
  --navy-deep: #0F2740;
  --teal: #1F5F5B;
  --gold: #F5A623;
  --gold-bright: #FFC629;
  --gold-soft: #FFF1D1;
  --blue: #2F6FED;
  --blue-soft: #E7EFFE;
  --cream: #FBF9F4;
  --paper: #FFFFFF;
  --ink: #1B2430;
  --ink-soft: #55606E;
  --line: #EBE8DE;
  --chat: #2C5F8A;
  --chat-bg: #EAF1F8;
  --callback: #6B3FA0;
  --callback-bg: #F2ECFA;
  --support: #D9782D;
  --support-bg: #FDF0E3;
  --rule: #D6483F;
  --rule-bg: #FCEBE9;
  --radius: 14px;
}
/* Playful color palette for topic/segment icon badges, cycled by index */
.badge-0{ background:#E7EFFE; color:#2F6FED; }
.badge-1{ background:#FFF1D1; color:#C9821A; }
.badge-2{ background:#E5F7EE; color:#1E9E63; }
.badge-3{ background:#F3EAFE; color:#8B4FE0; }
.badge-4{ background:#E4F7F9; color:#0FA3B1; }
.badge-5{ background:#FDEAF0; color:#E0447A; }
.badge-6{ background:#FEF0E3; color:#E08A2E; }
.badge-7{ background:#EAEBFE; color:#5B63D3; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--cream);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,.serif{font-family:'Source Serif 4', Georgia, serif;}

/* ---------- Top shell ---------- */
.app-header{
  background: linear-gradient(135deg, var(--navy-deep), var(--navy));
  color: #fff;
  padding: 18px 28px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.header-top{
  display:flex;
  align-items:center;
  justify-content: space-between;
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
}
.brand-mark{
  height:40px;
  border-radius:10px;
  background: #fff;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  padding:6px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.brand-mark img{ height:100%; width:auto; display:block; }
.brand-text h1{
  font-size: 20px;
  margin:0;
  font-weight:600;
  letter-spacing: 0.2px;
}
.brand-text p{
  margin:2px 0 0 0;
  font-size:12.5px;
  color: rgba(255,255,255,0.6);
  font-family:'JetBrains Mono', monospace;
  letter-spacing:0.3px;
}
.header-search-wrap{
  width: 340px;
  flex-shrink:0;
}
.header-search-input{
  width:100%;
  padding: 10px 16px;
  border-radius: 22px;
  border: 1.5px solid rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-family:'Inter',sans-serif;
  font-size:14px;
}
.header-search-input::placeholder{ color: rgba(255,255,255,0.55); }
.header-search-input:focus{
  outline:none;
  background: #fff;
  color: var(--ink);
  border-color: var(--gold-bright);
}
.header-search-input:focus::placeholder{ color: var(--ink-soft); }

/* ---------- App body: side-rail + main area ---------- */
.app-body{
  display:flex;
  align-items:flex-start;
}
.side-rail{
  width: 232px;
  flex-shrink:0;
  background: linear-gradient(180deg, var(--navy), var(--navy-deep));
  min-height: 100vh;
  position: sticky;
  top: 0;
  padding: 22px 12px;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.rail-hint{
  color: rgba(255,255,255,0.4);
  font-size:11px;
  font-family:'JetBrains Mono',monospace;
  text-transform:uppercase;
  letter-spacing:0.5px;
  padding: 0 12px 10px 12px;
}
.main-area{
  flex:1;
  min-width:0;
}
.tabs{ display:none; } /* legacy horizontal tabs container, replaced by side-rail */
.tab-btn{
  background:none;
  border:none;
  color: rgba(255,255,255,0.7);
  font-family:'Inter',sans-serif;
  font-size:14px;
  font-weight:600;
  padding: 12px 14px;
  cursor:pointer;
  border-radius: 12px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  width:100%;
  transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
}
.tab-btn:hover{ background: rgba(255,255,255,0.08); color:#fff; transform: translateX(2px); }
.tab-btn.active{
  background: linear-gradient(135deg, var(--gold-bright), var(--gold));
  color: var(--navy-deep);
  box-shadow: 0 3px 10px rgba(245,166,35,0.35);
}
.rail-icon{
  width:32px;height:32px;
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
  flex-shrink:0;
  background: rgba(255,255,255,0.12);
}
.tab-btn.active .rail-icon{ background: rgba(255,255,255,0.35); }
.rail-label{ display:flex; flex-direction:column; gap:2px; }
.rail-label-main{ font-size:14px; line-height:1.2; }
.tab-count{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color: rgba(255,255,255,0.55);
  font-weight:500;
}
.tab-btn.active .tab-count{ color: rgba(15,39,64,0.65); }

/* ---------- Panels ---------- */
.panel{ display:none; }
.panel.active{ display:block; }

.placeholder-panel{
  max-width: 640px;
  margin: 90px auto;
  text-align:center;
  padding: 0 24px;
}
.placeholder-panel .icon{
  font-size: 40px;
  margin-bottom: 18px;
  display:block;
}
.placeholder-panel h2{
  font-size:26px;
  color: var(--navy);
  margin: 0 0 10px 0;
}
.placeholder-panel p{
  color: var(--ink-soft);
  font-size:15px;
  line-height:1.6;
}
.coming-soon-badge{
  display:inline-block;
  margin-top:18px;
  background: linear-gradient(135deg, var(--gold-bright), var(--gold));
  color: var(--navy-deep);
  font-weight:700;
  font-size:13px;
  padding:8px 20px;
  border-radius:20px;
  box-shadow: 0 3px 10px rgba(245,166,35,0.3);
}
.incentive-placeholder .icon{ font-size:52px; }

.topic-icon-badge{
  width:26px;height:26px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;
  flex-shrink:0;
  margin-right:9px;
}

/* ---------- Cases SOP layout ---------- */
.sop-shell{
  display:flex;
  align-items:flex-start;
  max-width: 1400px;
  margin: 0 auto;
}
.sidebar{
  width: 280px;
  flex-shrink:0;
  padding: 22px 14px 40px 24px;
  position: sticky;
  top: 20px;
  max-height: calc(100vh - 40px);
  overflow-y:auto;
}
.sidebar::-webkit-scrollbar{width:6px;}
.sidebar::-webkit-scrollbar-thumb{background: var(--line); border-radius:4px;}

.side-search{
  margin-bottom:18px;
}
.side-search input{
  width:100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1.5px solid var(--line);
  font-family:'Inter',sans-serif;
  font-size:14px;
  background:#fff;
}
.side-search input:focus{ outline:2px solid var(--gold); outline-offset:1px; }

.topic-nav-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding: 11px 12px;
  border-radius: 8px;
  cursor:pointer;
  font-size: 14px;
  font-weight:500;
  color: var(--ink-soft);
  margin-bottom:2px;
  transition: background 0.12s ease, color 0.12s ease;
  border-left: 3px solid transparent;
}
.topic-nav-item:hover{ background: #F0EEE7; color:var(--ink); }
.topic-nav-item.active{
  background: #fff;
  color: var(--navy);
  font-weight:600;
  border-left-color: var(--gold);
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.topic-nav-item .count{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color: var(--ink-soft);
  background: #EFEDE6;
  padding:1px 7px;
  border-radius:10px;
  flex-shrink:0;
}
.topic-nav-item.active .count{ background: var(--gold-soft); color:#7A5A26; }

.content-area{
  flex:1;
  min-width:0;
  padding: 26px 32px 80px 24px;
}
.topic-heading{
  margin-bottom: 22px;
}
.topic-heading h2{
  font-size: 27px;
  color: var(--navy);
  margin:0 0 6px 0;
}
.topic-heading p{
  color: var(--ink-soft);
  font-size:14.5px;
  margin:0;
  max-width:700px;
  line-height:1.5;
}
.result-meta{
  font-family:'JetBrains Mono', monospace;
  font-size:12px;
  color: var(--ink-soft);
  margin: 4px 0 20px 0;
}

/* ---------- Scenario cards ---------- */
.scenario-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom:14px;
  overflow:hidden;
  transition: box-shadow 0.15s ease;
}
.scenario-card:hover{ box-shadow: 0 3px 14px rgba(20,49,74,0.07); }
.scenario-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  padding: 16px 20px;
  cursor:pointer;
  user-select:none;
}
.scenario-head-text{ flex:1; min-width:0; }
.breadcrumb{
  font-size:11.5px;
  color: var(--gold);
  font-weight:600;
  text-transform: uppercase;
  letter-spacing:0.4px;
  margin-bottom:5px;
  font-family:'JetBrains Mono', monospace;
}
.breadcrumb span:not(:last-child)::after{
  content: " › ";
  color: #C9BC9E;
}
.scenario-title{
  font-size:15.5px;
  font-weight:600;
  color: var(--ink);
  line-height:1.45;
}
.chip-row{
  display:flex;
  gap:6px;
  flex-shrink:0;
  padding-top:2px;
}
.chip{
  font-size:10.5px;
  font-weight:700;
  padding:3px 8px;
  border-radius:20px;
  font-family:'JetBrains Mono',monospace;
  letter-spacing:0.3px;
}
.chip.chat{ background:var(--chat-bg); color:var(--chat); }
.chip.callback{ background:var(--callback-bg); color:var(--callback); }
.chip.support{ background:var(--support-bg); color:var(--support); }

.expand-icon{
  width:22px;height:22px;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color: var(--ink-soft);
  transition: transform 0.2s ease;
  margin-top:2px;
}
.scenario-card.open .expand-icon{ transform: rotate(180deg); }

.scenario-body{
  display:none;
  border-top: 1px solid var(--line);
  padding: 4px 20px 18px 20px;
}
.scenario-card.open .scenario-body{ display:block; }

.process-cols{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap:14px;
  margin-top:14px;
}
.process-col{
  border-radius:8px;
  padding: 12px 14px 14px 14px;
}
.process-col.chat{ background: var(--chat-bg); }
.process-col.callback{ background: var(--callback-bg); }
.process-col.support{ background: var(--support-bg); }
.process-col-label{
  font-size:11.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.4px;
  margin-bottom:9px;
  font-family:'JetBrains Mono',monospace;
}
.process-col.chat .process-col-label{ color:var(--chat); }
.process-col.callback .process-col-label{ color:var(--callback); }
.process-col.support .process-col-label{ color:var(--support); }
.process-col ol{
  margin:0; padding-left:18px;
}
.process-col ol li{
  font-size:13.5px;
  line-height:1.55;
  margin-bottom:8px;
  color: var(--ink);
}
.process-col ol li:last-child{ margin-bottom:0; }

.extra-box{
  margin-top:14px;
  background: #F7F5EF;
  border: 1px dashed #D8CFB8;
  border-radius:8px;
  padding: 12px 14px;
}
.extra-box-title{
  font-size:11.5px;
  font-weight:700;
  color:var(--gold);
  text-transform:uppercase;
  letter-spacing:0.4px;
  margin-bottom:8px;
  font-family:'JetBrains Mono',monospace;
}
.extra-item{
  font-size:13px;
  line-height:1.5;
  margin-bottom:6px;
  color: var(--ink-soft);
}
.extra-item b{ color: var(--ink); font-weight:600; }
.extra-item:last-child{ margin-bottom:0; }

/* dual layout (Payment SOP) */
.dual-groups{ display:flex; flex-direction:column; gap:26px; }
.dual-group-label{
  font-size:16px;
  font-weight:600;
  color:var(--navy);
  margin-bottom:12px;
  padding-bottom:8px;
  border-bottom: 2px solid var(--gold-soft);
}
.dual-item{
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  padding:14px 18px;
  margin-bottom:10px;
}
.dual-item-condition{
  font-weight:600;
  font-size:14px;
  color:var(--ink);
  margin-bottom:8px;
}
.dual-item ol{ margin:0; padding-left:18px; }
.dual-item ol li{ font-size:13.5px; line-height:1.55; margin-bottom:6px; color:var(--ink-soft); }

/* faq layout (Webinar) */
.faq-item{
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  padding:16px 20px;
  margin-bottom:12px;
}
.faq-condition{
  font-weight:600;
  font-size:14.5px;
  color:var(--navy);
  margin-bottom:9px;
}
.faq-item ol{ margin:0 0 8px 0; padding-left:18px; }
.faq-item ol li{ font-size:13.5px; line-height:1.55; margin-bottom:6px; color:var(--ink); }
.faq-link{
  font-size:12.5px;
  color: var(--gold);
  font-family:'JetBrains Mono',monospace;
  margin-top:4px;
}

/* rules layout (Stitch Batch) */
.rule-card{
  background:#fff;
  border:1px solid var(--line);
  border-left: 4px solid var(--rule);
  border-radius:8px;
  padding:16px 20px;
  margin-bottom:12px;
}
.rule-title{
  font-weight:700;
  font-size:15px;
  color: var(--rule);
  margin-bottom:9px;
}
.rule-card ul{ margin:0; padding-left:18px; }
.rule-card ul li{ font-size:13.5px; line-height:1.55; margin-bottom:6px; color:var(--ink); }

.no-results{
  text-align:center;
  padding: 60px 20px;
  color: var(--ink-soft);
}
.no-results .icon{ font-size:32px; margin-bottom:12px; display:block; }

mark{
  background: var(--gold-soft);
  color: var(--ink);
  padding:0 2px;
  border-radius:2px;
}

/* ---------- Global operating rules banner ---------- */
.rules-banner{
  max-width:1400px;
  margin: 20px auto 0 auto;
  padding: 0 32px;
}
.rules-toggle{
  background: linear-gradient(135deg, #FFF8E9, #FBF0D8);
  border: 1px solid #E9D6A0;
  border-radius: 10px;
  padding: 12px 18px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-weight:600;
  font-size:14px;
  color:#7A5A1E;
}
.rules-toggle .arrow{ transition: transform 0.2s ease; }
.rules-toggle.open .arrow{ transform: rotate(180deg); }
.glossary-toggle{
  background: linear-gradient(135deg, var(--blue-soft), #DCE8FE);
  border-color: #C3D8FB;
  color: #1E4FBE;
}
.glossary-toggle + .rules-panel{ border-color:#C3D8FB; }
.rules-panel{
  display:none;
  background:#fff;
  border: 1px solid #E9D6A0;
  border-top:none;
  border-radius: 0 0 10px 10px;
  padding: 18px 22px 20px 22px;
}
.rules-panel.open{ display:block; }
.rules-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(260px,1fr));
  gap:14px;
  margin-bottom: 14px;
}
.rule-item{
  background: #FBFAF6;
  border:1px solid var(--line);
  border-radius:8px;
  padding:12px 14px;
}
.rule-item-title{
  font-weight:700;
  font-size:13.5px;
  color: var(--navy);
  margin-bottom:5px;
}
.rule-item-detail{
  font-size:12.5px;
  color: var(--ink-soft);
  line-height:1.5;
}
.mentor-slot-note{
  background: var(--support-bg);
  border-left: 3px solid var(--support);
  border-radius: 6px;
  padding: 12px 16px;
}
.mentor-slot-note-title{
  font-weight:700;
  font-size:13px;
  color: var(--support);
  margin-bottom:6px;
}
.mentor-slot-note ul{ margin:0; padding-left:18px; }
.mentor-slot-note li{ font-size:12.5px; line-height:1.5; color:var(--ink); margin-bottom:4px; }

/* topic-level mentor slot callout (inline, above scenario list) */
.topic-mentor-callout{
  background: var(--support-bg);
  border: 1px solid #EAD3B0;
  border-left: 4px solid var(--support);
  border-radius: 8px;
  padding: 13px 18px;
  margin-bottom:18px;
  font-size:13px;
  color: var(--ink);
}
.topic-mentor-callout b{ color: var(--support); }
.topic-mentor-callout ul{ margin:6px 0 0 0; padding-left:18px; }
.topic-mentor-callout li{ margin-bottom:4px; line-height:1.5; }

/* ---------- Redesigned reference box ---------- */
.ref-box{
  margin-top:14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow:hidden;
}
.ref-box-header{
  background: #F3F1EA;
  padding: 9px 16px;
  font-size:11.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.4px;
  color: var(--gold);
  font-family:'JetBrains Mono',monospace;
}
.ref-box-body{
  padding: 14px 16px 16px 16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.ref-section-label{
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.4px;
  color: var(--ink-soft);
  margin-bottom:8px;
}
.ref-comms-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap:10px;
}
.ref-comm-card{
  background:#FAFAF7;
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
}
.ref-comm-card-title{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:700;
  font-size:12.5px;
  color: var(--navy);
  margin-bottom:6px;
}
.ref-comm-card ul{ margin:0; padding-left:16px; }
.ref-comm-card li{ font-size:12px; line-height:1.5; color:var(--ink-soft); margin-bottom:3px; }
.ref-comm-standard-label{
  font-size:10.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.3px;
  color: var(--gold);
  margin: 8px 0 4px 0;
  padding-top: 7px;
  border-top: 1px dashed #E2DCC8;
}
.ref-comm-standard li{ color: var(--ink); }
.ref-links-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.ref-link-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background: var(--chat-bg);
  color: var(--chat);
  font-size:12px;
  font-weight:600;
  padding: 6px 11px;
  border-radius: 20px;
  text-decoration:none;
  border: 1px solid transparent;
  transition: border-color 0.12s ease;
  max-width:100%;
}
.ref-link-pill:hover{ border-color: var(--chat); }
.ref-link-pill.file{ background:#F3F1EA; color:var(--ink-soft); }

/* ---------- FAQ section ---------- */
.faq-section{
  margin-bottom: 26px;
}
.faq-section-toggle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 20px;
  cursor:pointer;
}
.faq-section-toggle h3{
  margin:0;
  font-size:16px;
  color: var(--navy);
  display:flex;
  align-items:center;
  gap:9px;
}
.faq-section-toggle .arrow{ transition: transform 0.2s ease; color:var(--ink-soft); }
.faq-section-toggle.open .arrow{ transform: rotate(180deg); }
.faq-list{
  display:none;
  border: 1px solid var(--line);
  border-top:none;
  border-radius: 0 0 10px 10px;
  padding: 6px 20px 14px 20px;
  background:#fff;
}
.faq-list.open{ display:block; }
.faq-qa{
  padding: 12px 0;
  border-bottom: 1px solid #EEEDE6;
}
.faq-qa:last-child{ border-bottom:none; }
.faq-q{
  font-weight:600;
  font-size:14px;
  color: var(--ink);
  margin-bottom:6px;
  display:flex;
  gap:8px;
}
.faq-q .q-mark{ color: var(--gold); flex-shrink:0; }
.faq-a{
  font-size:13.5px;
  line-height:1.6;
  color: var(--ink-soft);
  padding-left: 22px;
}

/* ---------- Step checkboxes (session-only interactivity) ---------- */
.process-col ol{ list-style:none; padding-left:0; counter-reset: step; }
.process-col ol li{
  counter-increment: step;
  position:relative;
  padding-left: 30px;
  cursor:pointer;
}
.process-col ol li::before{
  content: counter(step);
  position:absolute;
  left:0; top:0;
  width:19px; height:19px;
  border-radius:50%;
  font-size:10.5px;
  font-weight:700;
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;
}
.process-col.chat ol li::before{ background: var(--chat-bg); color:var(--chat); border:1px solid var(--chat); }
.process-col.support ol li::before{ background: var(--support-bg); color:var(--support); border:1px solid var(--support); }
.process-col ol li.done{ color: #9CA3AF; text-decoration: line-through; }
.process-col ol li.done::before{ content:"✓"; background: #DCEEE0; color:#2F8F4E; border-color:#2F8F4E; }
.substeps{
  list-style: disc;
  margin: 6px 0 0 0;
  padding-left: 18px;
}
.substeps li{
  counter-increment: none;
  padding-left: 0;
  font-size: 12.5px;
  color: var(--ink-soft);
  margin-bottom: 4px;
  cursor: default;
}
.substeps li::before{ content: none; display:none; }

.progress-track{
  height:5px;
  background:#EDEBE3;
  border-radius:3px;
  overflow:hidden;
  margin-top:12px;
}
.progress-fill{
  height:100%;
  background: var(--gold);
  border-radius:3px;
  transition: width 0.2s ease;
  width:0%;
}
.progress-label{
  font-size:11px;
  color: var(--ink-soft);
  margin-top:5px;
  font-family:'JetBrains Mono',monospace;
}

@media (max-width: 880px){
  .app-body{ flex-direction:column; }
  .side-rail{ width:100%; min-height:auto; position:static; flex-direction:row; overflow-x:auto; padding:10px; }
  .rail-hint{ display:none; }
  .tab-btn{ width:auto; flex-shrink:0; }
  .rail-label{ flex-direction:row; align-items:center; gap:6px; }
  .sop-shell{ flex-direction:column; }
  .sidebar{ position:static; width:100%; max-height:none; padding:16px; }
  .content-area{ padding:20px 16px 60px 16px; }
  .header-top{ flex-wrap:wrap; gap:10px; }
  .header-search-wrap{ width:100%; }
  .rules-banner{ padding: 0 16px; }
}

      "name": "Payment SOP",
      "type": "dual",
      "description": "Payment structure, deferment, due-date, and installment queries.",
      "groups": [
        {
          "label": "When the customer reaches out on Chat",
          "items": [
            {
              "condition": "When a customer requests payment or course fee details, raises a concern regarding the installment amount, or wants to know about paid installments or completed classes (basically where we have check the details and inform)",
              "steps": [
                {
                  "main": "In such cases, the agent should open the customer’s payment structure in Epicenter and review it carefully before sharing any information on chat.B) If the concern involves class-related details, the agent should check the customer’s “Edit Order” section to review the total classes enrolled, classes attended, paid classes, and sibling enrollment details.C) After reviewing the payment structure and Edit order carefully, the agent should share the requested or relevant information with the customer over chat. If required, a screenshot of the payment structure can also be shared for better clarity.",
                  "subs": []
                },
                {
                  "main": "NOTE: Payment details are sensitive information. Agents must cross-check all data carefully before sharing it with the customer to ensure accuracy and avoid any discrepancies.",
                  "subs": []
                }
              ]
            },
            {
              "condition": "When a customer requests changes in the payment structure, a change in the due date, wishes to pay the outstanding amount to resume classes, wants to update credit card details, or have discrepancies related to deductions.",
              "steps": [
                {
                  "main": "We should cross-check the customer’s details on Epicenter by reviewing the respective payment structure, inform the customer about the existing plan and due date, and then confirm the specific changes they have requested.B) After confirming the requested changes, the agent should raise a support case with a clear description and the correct properties.",
                  "subs": []
                }
              ]
            },
            {
              "condition": "When a customer follows up on a case that has already been raised but is still pending resolution from the payments team.",
              "steps": [
                {
                  "main": "The agent should open the already raised case, review the internal notes for updates, and inform the customer about the steps that have been taken by the team on the case.B) After sharing the updates with the customer, the agent should highlight the case in the “Follow-up Tracker” and tag the case owner. (Right-click on the cell → select “New Comment” → tag the case owner using @).C) Once the case is added to the Follow-up Tracker, the agent should inform the customer that the case has been highlighted to the respective team and that the team will reach out with an update as early as possible.",
                  "subs": []
                },
                {
                  "main": "NOTE: If the case has been overdue for a long time and the customer expresses frustration, the agent should highlight the case in the Classes Team WhatsApp group, tagging both the case owner and the respective managers.",
                  "subs": []
                }
              ]
            }
          ]
        },
        {
          "label": "When the customer requests a call / is not responding",
          "items": [
            {
              "condition": "When a customer is asking for a callback/asking for a callback from the payments team.",
              "steps": [
                {
                  "main": "The agent should open the \"Payments structure\" on Epicenter before calling the customer.B) After that, the agent should connect with the customer and address all their concerns. If the customer requests any changes related to the payment structure, the agent should create a case for the same and inform the customer that the team will provide an update within 2–3 days.",
                  "subs": []
                },
                {
                  "main": "NOTE: The customer may mention that they want someone from the payments team to reach out for even small payment related information. In such cases, the agent should place the call assuming it to be a normal payment-related concern. If, during the call, the customer requests any changes, the agent should then raise a case for those changes.",
                  "subs": []
                }
              ]
            },
            {
              "condition": "When the customer has mentioned about the payment related concern over chat and then went offline.",
              "steps": [
                {
                  "main": "The agent should share all relevant details over chat based on the parent’s concern and wait for 10 minutes. If the customer is still offline, a callback should be made.B) We need to call the customer up to three times, with a gap of at least 5 minutes between each call. If the customer remains unresponsive after all attempts, the agent should attach a screenshot of the call attempts in the internal notes and then close the chat.C) If the customer responds, the agent should address their concern accordingly. If the customer requests any changes or raises a concern that requires a case, the agent can raise the case after the call is completed.D) After the call, the agent should add a callback summary on chat, starting with:\"Dear Parent, as per the discussion over the call...\"If a case was raised during the call, the case number should also be mentioned in the chat before closing it.",
                  "subs": []
                }
              ]
            }
          ]
        }
      ],
      "faqs": [
        {
          "q": "A customer wants a small payment detail explained — do I need to call them?",
          "a": "Not necessarily. Simple detail requests (installments paid, amounts due) can be handled on chat after reviewing Epicenter’s payment structure. Calls are for callback requests or when the customer goes non-responsive after sharing partial details."
        },
        {
          "q": "Customer wants to change their payment structure or due date — can I do that on chat?",
          "a": "No. Cross-check details on Epicenter, confirm the requested change with the customer, then raise a support case — payment structure changes always go through a case."

        {
          "q": "How many times should I call before giving up?",

            "Only if they ask twice"
          ],
          "answerIndex": 1,

        }

      {
        "title": "Case ownership: assign it to yourself",

      {
        "title": "First response within 24 hours — no exceptions",
        "detail": "The Acknowledgement Mail or first Progress Mail must go out within 24 hours of the case being raised. This is the single most important SLA — it’s what tells the customer someone is actually on it."
      },
      {
        "title": "Log every update, no matter how small",
        "detail": "Every single update on a case — even a one-line change or a quick call that didn’t go anywhere — must be logged in the case notes. Small updates left unlogged are exactly what cause confusion when another teammate picks up the case."
      },
      {
        "title": "Progress mail: sent daily while unresolved, backed by a call",
        "detail": "Every day a case stays open, call the customer to update them on progress. If you reach them, send the day’s Progress Mail confirming what was discussed. If the customer is RNR, send the combined Progress + RNR Mail instead — never both separately."

        "title": "Call cadence: 4 attempts a day, spread out",
        "detail": "Make 4 call attempts per day at different times of day (not back-to-back). Attach a screenshot of each individual call attempt to internal notes."
      },
      {
        "title": "Case closure on RNR: only after 48 hours + 8 call attempts",
        "detail": "A case can only be closed on RNR grounds after 48 hours have passed AND at least 8 call attempts have been made. The closure mail must include the date/time of all 8+ attempts made to reach the customer."
      },
      {
        "title": "Escalations — especially cross-functional — need the form filled",

        "title": "Ask for a Google/Trustpilot review on fast or permanent resolutions",

      "title": "Mentor / Schedule Change cases — special RNR handling",

      "title": "Do-Not-Contact (DNC) Requests — handle immediately, don’t just reply",

        "Immediately after sending the mail, add the customer’s number to the DNC list in Salesforce/Epicenter — sending the confirmation without actually updating the system is a compliance gap, not a resolution.",
        "If they have an open case, service-related email updates may continue unless they’ve asked for that to stop too — but never call, text, or WhatsApp that number again regardless of case type going forward."
      ]

<script>
const DATA = JSON.parse(document.getElementById('sop-data').textContent);
const topics = DATA.topics;
const globalRules = DATA.globalRules;

let activeTopicId = topics[0].id;
let searchQuery = '';
const faqOpenState = {};
const scenarioCheckOpenState = {};
const stepDoneState = {};

function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function highlight(text, q) {
  const esc = escapeHtml(text);
  if (!q) return esc;
  try {
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return esc.replace(re, '<mark>$1</mark>');
  } catch (e) {
    return esc;
  }
}

function countEntries(topic) {
  if (topic.scenarios) return topic.scenarios.length;
  if (topic.items) return topic.items.length;
  if (topic.rules) return topic.rules.length;
  if (topic.groups) return topic.groups.reduce((a, g) => a + g.items.length, 0);
  return 0;
}

function matches(text, q) {
  return text.toLowerCase().includes(q.toLowerCase());
}

function stepArrayToText(steps) {
  if (!steps) return '';
  return steps.map(s => (typeof s === 'string' ? s : (s.main + ' ' + (s.subs || []).join(' ')))).join(' ');
}

function scenarioMatchesSearch(sc, q) {
  if (!q) return true;
  const hay = [
    sc.scenario || '',
    (sc.breadcrumb || []).join(' '),
    stepArrayToText(sc.chat),
    stepArrayToText(sc.callback),
    stepArrayToText(sc.support),
  ].join(' ');
  return matches(hay, q);
}

const TOPIC_ICONS = {
  batch_course: '\ud83d\udcc5',
  class_related: '\ud83d\udd01',
  mentor_change: '\ud83e\udd1d',
  payment_sop: '\ud83d\udcb3',
  refund_defaulter: '\ud83e\ude99',
  tech: '\ud83d\udd27',
  webinar: '\ud83c\udfa5',
  stitch_batch: '\ud83d\udd17',
};

function renderTopicNav() {
  const nav = document.getElementById('topicNav');
  nav.innerHTML = topics.map((t, i) => `
    <div class="topic-nav-item ${t.id === activeTopicId ? 'active' : ''}" data-topic="${t.id}">
      <span style="display:flex;align-items:center;">
        <span class="topic-icon-badge badge-${i % 8}">${TOPIC_ICONS[t.id] || '\ud83d\udcc4'}</span>
        ${escapeHtml(t.name)}
      </span>
      <span class="count">${countEntries(t)}</span>
    </div>
  `).join('');
  nav.querySelectorAll('.topic-nav-item').forEach(el => {
    el.addEventListener('click', () => {
      activeTopicId = el.getAttribute('data-topic');
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('emailSearchInput').value = '';
      document.getElementById('globalHeaderSearch').value = '';
      renderTopicNav();
      renderContent();
    });
  });
}

function renderRulesPanel() {
  const panel = document.getElementById('rulesPanel');
  const items = globalRules.daily_standards.map(r => `
    <div class="rule-item">
      <div class="rule-item-title">${escapeHtml(r.title)}</div>
      <div class="rule-item-detail">${escapeHtml(r.detail)}</div>
      ${r.link ? `<a href="${escapeHtml(r.link)}" target="_blank" rel="noopener" class="ref-link-pill" style="margin-top:8px;display:inline-flex;">\ud83d\udd17 Open Escalation Form</a>` : ''}
    </div>
  `).join('');
  const mentorRule = globalRules.mentor_slot_cases;
  const dncRule = globalRules.dnc_handling;
  panel.innerHTML = `
    <div class="rules-grid">${items}</div>
    <div class="mentor-slot-note">
      <div class="mentor-slot-note-title">\ud83d\udd01 ${escapeHtml(mentorRule.title)}</div>
      <ul>${mentorRule.points.map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul>
    </div>
    ${dncRule ? `
    <div class="mentor-slot-note" style="margin-top:10px;">
      <div class="mentor-slot-note-title">\ud83d\udeab ${escapeHtml(dncRule.title)}</div>
      <ul>${dncRule.points.map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul>
    </div>
    ` : ''}
  `;
  const toggle = document.getElementById('rulesToggle');
  toggle.addEventListener('click', () => {
    toggle.classList.toggle('open');
    panel.classList.toggle('open');
  });
}

function renderGlossaryPanel() {
  const panel = document.getElementById('glossaryPanel');
  const glossary = globalRules.glossary || [];
  panel.innerHTML = `
    <div class="rules-grid">
      ${glossary.map(g => `
        <div class="rule-item">
          <div class="rule-item-title">${escapeHtml(g.term)}</div>
          <div class="rule-item-detail">${escapeHtml(g.meaning)}</div>
        </div>
      `).join('')}
    </div>
  `;
  const toggle = document.getElementById('glossaryToggle');
  toggle.addEventListener('click', () => {
    toggle.classList.toggle('open');
    panel.classList.toggle('open');
  });
}

const COMM_ICONS = {
  'Acknowledgement Mail': '\ud83d\udce9',
  'Progress Mail': '\ud83d\udcc8',
  'Closure Mail': '\ud83d\udd12',
  'Mail to Mentor': '\ud83e\uddd1\u200d\ud83c\udfeb',
  'RNR Mail': '\ud83d\udd15',
  'Flow': '\ud83d\udd00',
  'To-Do (Post Mentor Change)': '\u2705',
  'Canned Response': '\ud83d\udcac',
};

function renderRefBox(extra, includeRNR) {
  if (!extra) extra = {};
  const comms = extra.comms || {};
  const links = extra.links || [];
  const checklists = (globalRules.comm_checklists) || {};
  let commKeys = Object.keys(comms);
  if (includeRNR && !commKeys.includes('RNR Mail')) {
    commKeys = [...commKeys, 'RNR Mail'];
  }
  if (!commKeys.length && !links.length) return '';

  const commsHtml = commKeys.length ? `
    <div>
      <div class="ref-section-label">Communication Rules</div>
      <div class="ref-comms-grid">
        ${commKeys.map(k => {
          const standard = checklists[k] || [];
          const caseLines = comms[k] || [];
          return `
          <div class="ref-comm-card">
            <div class="ref-comm-card-title">${COMM_ICONS[k] || '\u2022'} ${escapeHtml(k)}</div>
            ${caseLines.length ? `<ul>${caseLines.map(l => `<li>${escapeHtml(l)}</li>`).join('')}</ul>` : ''}
            ${standard.length ? `
              <div class="ref-comm-standard-label">Standard checks</div>
              <ul class="ref-comm-standard">${standard.map(l => `<li>${escapeHtml(l)}</li>`).join('')}</ul>
            ` : ''}
          </div>
        `;
        }).join('')}
      </div>
    </div>
  ` : '';

  const linksHtml = links.length ? `
    <div>
      <div class="ref-section-label">Tools &amp; Links</div>
      <div class="ref-links-row">
        ${links.map(l => {
          const isUrl = /^https?:\/\//.test(l.url);
          if (isUrl) {
            return `<a class="ref-link-pill" href="${escapeHtml(l.url)}" target="_blank" rel="noopener">\ud83d\udd17 ${escapeHtml(l.label)}</a>`;
          }
          return `<span class="ref-link-pill file">\ud83d\udcc4 ${escapeHtml(l.label)}: ${escapeHtml(l.url)}</span>`;
        }).join('')}
      </div>
    </div>
  ` : '';

  return `
    <div class="ref-box">
      <div class="ref-box-header">Additional References</div>
      <div class="ref-box-body">${commsHtml}${linksHtml}</div>
    </div>
  `;
}

function renderFaqSection(topic) {
  if (!topic.faqs || !topic.faqs.length) return '';
  const isOpen = !!faqOpenState[topic.id];
  return `
    <div class="faq-section">
      <div class="faq-section-toggle ${isOpen ? 'open' : ''}" id="faqToggle">
        <h3>\ud83d\udca1 Frequently Asked Questions <span style="font-weight:400;color:var(--ink-soft);font-size:13px;">(${topic.faqs.length})</span></h3>
        <span class="arrow">\u25be</span>
      </div>
      <div class="faq-list ${isOpen ? 'open' : ''}" id="faqList">
        ${topic.faqs.map(f => `
          <div class="faq-qa">
            <div class="faq-q"><span class="q-mark">Q.</span> ${escapeHtml(f.q)}</div>
            <div class="faq-a">${escapeHtml(f.a)}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

const scenarioCheckAnsweredState = {};

function renderScenarioCheckCard(topicId, q, qIdx) {
  const key = `${topicId}:${qIdx}`;
  const answered = scenarioCheckAnsweredState[key];
  return `
    <div class="quiz-card">
      <div class="quiz-q">Q${qIdx + 1}. ${escapeHtml(q.q)}</div>
      ${q.options.map((opt, oIdx) => {
        let cls = '';
        if (answered !== undefined) {
          if (oIdx === q.answerIndex) cls = 'correct';
          else if (oIdx === answered) cls = 'incorrect';
        }
        return `<button class="quiz-option ${cls}" data-sctopic="${topicId}" data-qidx="${qIdx}" data-oidx="${oIdx}">${escapeHtml(opt)}</button>`;
      }).join('')}
      <div class="quiz-explanation ${answered !== undefined ? 'show' : ''}" id="sc-exp-${topicId}-${qIdx}">${escapeHtml(q.explanation)}</div>
    </div>
  `;
}

function renderScenarioCheckSection(topic) {
  if (!topic.scenarioChecks || !topic.scenarioChecks.length) return '';
  const isOpen = !!scenarioCheckOpenState[topic.id];
  return `
    <div class="faq-section">
      <div class="faq-section-toggle ${isOpen ? 'open' : ''}" id="scToggle">
        <h3>\ud83c\udfaf Scenario Check <span style="font-weight:400;color:var(--ink-soft);font-size:13px;">(${topic.scenarioChecks.length} practice questions)</span></h3>
        <span class="arrow">\u25be</span>
      </div>
      <div class="faq-list ${isOpen ? 'open' : ''}" id="scList">
        ${topic.scenarioChecks.map((q, i) => renderScenarioCheckCard(topic.id, q, i)).join('')}
      </div>
    </div>
  `;
}

function renderMentorCallout(topic) {
  const rule = globalRules.mentor_slot_cases;
  if (!rule.applies_to.includes(topic.id)) return '';
  return `
    <div class="topic-mentor-callout">
      <b>\ud83d\udd01 Reminder for this topic:</b> ${escapeHtml(rule.points[0])} ${escapeHtml(rule.points[1])}
    </div>
  `;
}


function renderStepLi(step, key, extraAttrs) {
  const done = key && stepDoneState[key] ? 'done' : '';
  const keyAttr = key ? `data-key="${key}"` : '';
  const subsHtml = (step.subs && step.subs.length)
    ? `<ul class="substeps">${step.subs.map(s => `<li>${highlight(s, searchQuery)}</li>`).join('')}</ul>`
    : '';
  return `<li class="${done}" ${keyAttr} ${extraAttrs || ''}>${highlight(step.main, searchQuery)}${subsHtml}</li>`;
}

function renderTriageScenario(sc, idx, topicIdOverride) {
  const keyTopicId = topicIdOverride || activeTopicId;
  const cols = [];
  const merged = [...(sc.chat || []), ...(sc.callback || [])];
  if (merged.length) cols.push({ label: 'Chat & Callback SOP', cls: 'chat', steps: merged });
  if (sc.support && sc.support.length) cols.push({ label: 'Case SOP', cls: 'support', steps: sc.support });

  const chips = [];
  if (merged.length) chips.push('<span class="chip chat">Chat &amp; Callback</span>');
  if (sc.support && sc.support.length) chips.push('<span class="chip support">Case</span>');
  const breadcrumbHtml = (sc.breadcrumb && sc.breadcrumb.length)
    ? `<div class="breadcrumb">${sc.breadcrumb.map(b => `<span>${highlight(b, searchQuery)}</span>`).join('')}</div>`
    : '';

  const colsHtml = cols.map((c, colIdx) => {
    const totalSteps = c.steps.length;
    return `
    <div class="process-col ${c.cls}" data-col="${colIdx}" data-total="${totalSteps}">
      <div class="process-col-label">${c.label}</div>
      <ol>${c.steps.map((s, stepIdx) => renderStepLi(s, `${keyTopicId}:${idx}:${colIdx}:${stepIdx}`)).join('')}</ol>
      <div class="progress-track"><div class="progress-fill" style="width:0%"></div></div>
      <div class="progress-label">0 / ${totalSteps} steps reviewed</div>
    </div>
  `;
  }).join('');

  const refHtml = renderRefBox(sc.extra, true);

  return `
    <div class="scenario-card" data-idx="${idx}">
      <div class="scenario-head">
        <div class="scenario-head-text">
          ${breadcrumbHtml}
          <div class="scenario-title">${highlight(sc.scenario, searchQuery)} ${sc.isNewly ? '<span class="new-badge">New</span>' : ''}</div>
        </div>
        <div class="chip-row">${chips.join('')}</div>
        <div class="expand-icon">\u25be</div>
      </div>
      <div class="scenario-body">
        <div class="process-cols">${colsHtml}</div>
        ${refHtml}
      </div>
    </div>
  `;
}

function renderDualTopic(topic) {
  const q = searchQuery.toLowerCase();
  return `
    <div class="dual-groups">
      ${topic.groups.map(g => {
        let items = g.items;
        if (q) items = items.filter(it => (it.condition + ' ' + stepArrayToText(it.steps)).toLowerCase().includes(q));
        if (!items.length) return '';
        return `
          <div class="dual-group">
            <div class="dual-group-label">${escapeHtml(g.label)}</div>
            ${items.map(it => `
              <div class="dual-item">
                <div class="dual-item-condition">${highlight(it.condition, searchQuery)}</div>
                <ol>${it.steps.map(s => renderStepLi(s)).join('')}</ol>
              </div>
            `).join('')}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderFaqTopic(topic) {
  const q = searchQuery.toLowerCase();
  let items = topic.items;
  if (q) items = items.filter(it => (it.condition + ' ' + stepArrayToText(it.steps)).toLowerCase().includes(q));
  if (!items.length) return renderNoResults();
  return items.map(it => `
    <div class="faq-item">
      <div class="faq-condition">${highlight(it.condition, searchQuery)}</div>
      <ol>${it.steps.map(s => renderStepLi(s)).join('')}</ol>
      ${it.link ? `<div class="faq-link">\ud83d\udd17 ${escapeHtml(it.link)}</div>` : ''}
    </div>
  `).join('');
}

function renderRulesTopic(topic) {
  const q = searchQuery.toLowerCase();
  let rules = topic.rules;
  if (q) rules = rules.filter(r => (r.title + ' ' + r.points.join(' ')).toLowerCase().includes(q));
  if (!rules.length) return renderNoResults();
  return rules.map(r => `
    <div class="rule-card">
      <div class="rule-title">${highlight(r.title, searchQuery)}</div>
      <ul>${r.points.map(p => `<li>${highlight(p, searchQuery)}</li>`).join('')}</ul>
    </div>
  `).join('');
}

function renderNoResults() {
  return `
    <div class="no-results">
      <span class="icon">\ud83d\udd0e</span>
      <div>No scenarios match "<b>${escapeHtml(searchQuery)}</b>" in this topic.</div>
    </div>
  `;
}

function topicMatchesHtml(topic, query) {
  // Returns { html, count } of matching entries for one SOP topic, each
  // item wrapped with a small topic-label header for context in global search.
  const label = `<div class="global-item-label">\ud83d\udcc1 ${escapeHtml(topic.name)}</div>`;
  let html = '';
  let count = 0;

  if (topic.type === 'triage') {
    topic.scenarios.forEach((sc, i) => {
      if (scenarioMatchesSearch(sc, query)) {
        html += label + renderTriageScenario(sc, i, topic.id);
        count++;
      }
    });
  } else if (topic.type === 'dual') {
    const q = query.toLowerCase();
    topic.groups.forEach(g => {
      g.items.forEach(it => {
        if ((it.condition + ' ' + stepArrayToText(it.steps)).toLowerCase().includes(q)) {
          html += label + `
            <div class="dual-item">
              <div class="dual-item-condition">${highlight(it.condition, query)}</div>
              <ol>${it.steps.map(s => renderStepLi(s)).join('')}</ol>
            </div>
          `;
          count++;
        }
      });
    });
  } else if (topic.type === 'faq') {
    const q = query.toLowerCase();
    topic.items.forEach(it => {
      if ((it.condition + ' ' + stepArrayToText(it.steps)).toLowerCase().includes(q)) {
        html += label + `
          <div class="faq-item">
            <div class="faq-condition">${highlight(it.condition, query)}</div>
            <ol>${it.steps.map(s => renderStepLi(s)).join('')}</ol>
            ${it.link ? `<div class="faq-link">\ud83d\udd17 ${escapeHtml(it.link)}</div>` : ''}
          </div>
        `;
        count++;
      }
    });
  } else if (topic.type === 'rules') {
    const q = query.toLowerCase();
    topic.rules.forEach(r => {
      if ((r.title + ' ' + r.points.join(' ')).toLowerCase().includes(q)) {
        html += label + `
          <div class="rule-card">
            <div class="rule-title">${highlight(r.title, query)}</div>
            <ul>${r.points.map(p => `<li>${highlight(p, query)}</li>`).join('')}</ul>
          </div>
        `;
        count++;
      }
    });
  }
  return { html, count };
}

function getAllSopMatches(query) {
  let html = '';
  let count = 0;
  topics.forEach(topic => {
    const r = topicMatchesHtml(topic, query);
    html += r.html;
    count += r.count;
  });
  return { html, count };
}

function getAllEmailMatches(query) {
  let html = '';
  let count = 0;
  emailCategories.forEach(cat => {
    const label = `<div class="global-item-label">\u2709\ufe0f ${escapeHtml(cat.name)}</div>`;
    cat.templates.forEach(t => {
      if (templateMatchesSearch(t, query)) {
        html += label + renderEmailCard(t);
        count++;
      }
    });
  });
  return { html, count };
}

function renderGlobalSearchInto(area) {
  const sop = getAllSopMatches(searchQuery);
  const email = getAllEmailMatches(searchQuery);
  const totalCount = sop.count + email.count;

  area.innerHTML = `
    <div class="topic-heading">
      <h2>Search Results</h2>
      <p>Searching the entire database \u2014 SOP and Email Templates together.</p>
    </div>
    <div class="result-meta">${totalCount} result${totalCount === 1 ? '' : 's'} for "${escapeHtml(searchQuery)}"</div>
    <div class="global-search-section">
      <div class="global-search-section-title">\ud83d\udccb SOP (${sop.count})</div>
      ${sop.count ? sop.html : '<div class="no-results" style="padding:20px 0;"><div>No matching SOP scenarios.</div></div>'}
    </div>
    <div class="global-search-section">
      <div class="global-search-section-title">\u2709\ufe0f Email Templates (${email.count})</div>
      ${email.count ? email.html : '<div class="no-results" style="padding:20px 0;"><div>No matching email templates.</div></div>'}
    </div>
  `;

  attachSopCardListeners(area);
  attachEmailCardListeners(area);
}

function renderContent() {
  const area = document.getElementById('contentArea');
  if (searchQuery) { renderGlobalSearchInto(area); return; }
  const topic = topics.find(t => t.id === activeTopicId);
  let bodyHtml = '';
  let resultCount = null;

  if (topic.type === 'triage') {
    let scenarios = topic.scenarios;
    if (searchQuery) scenarios = scenarios.filter(sc => scenarioMatchesSearch(sc, searchQuery));
    resultCount = scenarios.length;
    bodyHtml = scenarios.length
      ? scenarios.map((sc, i) => renderTriageScenario(sc, i)).join('')
      : renderNoResults();
  } else if (topic.type === 'dual') {
    bodyHtml = renderDualTopic(topic);
  } else if (topic.type === 'faq') {
    bodyHtml = renderFaqTopic(topic);
  } else if (topic.type === 'rules') {
    bodyHtml = renderRulesTopic(topic);
  }

  area.innerHTML = `
    <div class="topic-heading">
      <h2>${escapeHtml(topic.name)}</h2>
      <p>${escapeHtml(topic.description || '')}</p>
    </div>
    ${renderMentorCallout(topic)}
    ${renderFaqSection(topic)}
    ${renderScenarioCheckSection(topic)}
    ${resultCount !== null ? `<div class="result-meta">${resultCount} scenario${resultCount === 1 ? '' : 's'}${searchQuery ? ` matching "${escapeHtml(searchQuery)}"` : ''}</div>` : ''}
    ${bodyHtml}
  `;

  attachSopCardListeners(area);

  const faqToggle = document.getElementById('faqToggle');
  if (faqToggle) {
    faqToggle.addEventListener('click', () => {
      faqOpenState[topic.id] = !faqOpenState[topic.id];
      faqToggle.classList.toggle('open');
      document.getElementById('faqList').classList.toggle('open');
    });
  }

  const scToggle = document.getElementById('scToggle');
  if (scToggle) {
    scToggle.addEventListener('click', () => {
      scenarioCheckOpenState[topic.id] = !scenarioCheckOpenState[topic.id];
      scToggle.classList.toggle('open');
      document.getElementById('scList').classList.toggle('open');
    });
  }
  area.querySelectorAll('[data-sctopic]').forEach(btn => {
    btn.addEventListener('click', () => {
      const tId = btn.getAttribute('data-sctopic');
      const qIdx = parseInt(btn.getAttribute('data-qidx'), 10);
      const oIdx = parseInt(btn.getAttribute('data-oidx'), 10);
      const key = `${tId}:${qIdx}`;
      if (scenarioCheckAnsweredState[key] !== undefined) return;
      scenarioCheckAnsweredState[key] = oIdx;
      renderContent();
    });
  });
}

function attachSopCardListeners(area) {
  area.querySelectorAll('.scenario-card').forEach(card => {
    card.querySelector('.scenario-head').addEventListener('click', () => {
      card.classList.toggle('open');
    });
  });

  area.querySelectorAll('.process-col').forEach(col => {
    updateProgress(col);
    col.querySelectorAll('ol li').forEach(li => {
      li.addEventListener('click', () => {
        const key = li.getAttribute('data-key');
        stepDoneState[key] = !stepDoneState[key];
        li.classList.toggle('done');
        updateProgress(col);
      });
    });
  });
}

function updateProgress(col) {
  const items = col.querySelectorAll('ol li');
  const total = items.length;
  let done = 0;
  items.forEach(li => { if (li.classList.contains('done')) done++; });
  const pct = total ? Math.round((done / total) * 100) : 0;
  const fill = col.querySelector('.progress-fill');
  const label = col.querySelector('.progress-label');
  if (fill) fill.style.width = pct + '%';
  if (label) label.textContent = `${done} / ${total} steps reviewed`;
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  document.getElementById('searchInput').value = searchQuery;
  document.getElementById('emailSearchInput').value = searchQuery;
  document.getElementById('globalHeaderSearch').value = searchQuery;
  renderContent();
  renderEmailContent();
});

document.getElementById('globalHeaderSearch').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  document.getElementById('searchInput').value = searchQuery;
  document.getElementById('emailSearchInput').value = searchQuery;
  if (searchQuery) {
    switchToTab('cases');
  }
  renderContent();
  renderEmailContent();
});

function switchToTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === tabName));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tabName).classList.add('active');
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    switchToTab(btn.getAttribute('data-tab'));
  });
});

function jumpToSopTopic(topicId) {
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('emailSearchInput').value = '';
  document.getElementById('globalHeaderSearch').value = '';
  activeTopicId = topicId;
  switchToTab('cases');
  renderTopicNav();
  renderContent();
  document.getElementById('panel-cases').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function jumpToEmailCategory(catId) {
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('emailSearchInput').value = '';
  document.getElementById('globalHeaderSearch').value = '';
  activeEmailCatId = catId;
  switchToTab('emails');
  renderEmailTopicNav();
  renderEmailContent();
  document.getElementById('panel-emails').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('casesCount').textContent = topics.reduce((a, t) => a + countEntries(t), 0) + ' entries';

renderRulesPanel();
renderGlossaryPanel();
renderContent();

const EMAIL_DATA = JSON.parse(document.getElementById('email-data').textContent);
const emailCategories = EMAIL_DATA.categories;
let activeEmailCatId = emailCategories[0].id;
const emailOpenState = {};      // templateId -> bool
const variantActiveState = {};  // templateId -> audience label

function countEmailTemplates(cat) {
  return cat.templates.length;
}

function templateMatchesSearch(t, q) {
  if (!q) return true;
  const hay = [
    t.title,
    t.whenToUse,
    ...t.variants.map(v => v.subject + ' ' + v.body),
  ].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

function highlightPlaceholders(text) {
  // wrap [Bracketed] and {{mustache}} placeholders for visual distinction
  let esc = escapeHtml(text);
  esc = esc.replace(/\[([^\]]+)\]/g, '<span class="placeholder">[$1]</span>');
  esc = esc.replace(/\{\{([^}]+)\}\}/g, '<span class="placeholder">{{$1}}</span>');
  return esc;
}

function renderEmailTopicNav() {
  const nav = document.getElementById('emailTopicNav');
  nav.innerHTML = emailCategories.map((c, i) => `
    <div class="topic-nav-item ${c.id === activeEmailCatId ? 'active' : ''}" data-cat="${c.id}">
      <span style="display:flex;align-items:center;">
        <span class="topic-icon-badge badge-${i % 8}">\ud83d\udce8</span>
        ${escapeHtml(c.name)}
      </span>
      <span class="count">${countEmailTemplates(c)}</span>
    </div>
  `).join('');
  nav.querySelectorAll('.topic-nav-item').forEach(el => {
    el.addEventListener('click', () => {
      activeEmailCatId = el.getAttribute('data-cat');
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('emailSearchInput').value = '';
  document.getElementById('globalHeaderSearch').value = '';
      renderEmailTopicNav();
      renderEmailContent();
    });
  });
}

function renderEmailCard(t) {
  const isOpen = !!emailOpenState[t.id];
  const activeVariantLabel = variantActiveState[t.id] || t.variants[0].audience;

  const chips = [...new Set(t.variants.map(v => v.audience))]
    .map(a => `<span class="audience-chip ${a}">${a}</span>`).join('');

  const tabsHtml = t.variants.length > 1 ? `
    <div class="variant-tabs">
      ${t.variants.map(v => `
        <button class="variant-tab-btn ${v.audience === activeVariantLabel ? 'active' : ''}" data-template="${t.id}" data-audience="${v.audience}">${escapeHtml(v.audience)}</button>
      `).join('')}
    </div>
  ` : '';

  const panesHtml = t.variants.map(v => `
    <div class="variant-pane ${v.audience === activeVariantLabel ? 'active' : ''}" data-template="${t.id}" data-audience="${v.audience}">
      <div class="email-field">
        <div class="email-field-label">Subject</div>
        <div class="email-subject">${highlightPlaceholders(v.subject)}</div>
      </div>
      <div class="email-field">
        <div class="email-field-label">Body</div>
        <div class="email-body-box">${highlightPlaceholders(v.body)}<img class="email-logo" src="${LOGO_DATA_URI}" alt="Codeyoung logo"></div>
      </div>
      <button class="copy-btn" data-copy-template="${t.id}" data-copy-audience="${v.audience}">Copy body to clipboard</button>
    </div>
  `).join('');

  return `
    <div class="email-card ${isOpen ? 'open' : ''}" data-template-card="${t.id}">
      <div class="email-card-head">
        <div class="email-card-head-text">
          <div class="email-title-row">
            <span class="email-title">${escapeHtml(t.title)}</span>
            ${t.isNew ? '<span class="new-badge">New \u2014 drafted to fill SOP gap</span>' : ''}
          </div>
          <div class="email-when">${escapeHtml(t.whenToUse)}</div>
        </div>
        <div class="audience-chips">${chips}</div>
        <div class="expand-icon">\u25be</div>
      </div>
      <div class="email-card-body">
        ${tabsHtml}
        ${panesHtml}
      </div>
    </div>
  `;
}

function renderEmailContent() {
  const area = document.getElementById('emailContentArea');
  if (searchQuery) { renderGlobalSearchInto(area); return; }
  const cat = emailCategories.find(c => c.id === activeEmailCatId);
  let templates = cat.templates;
  if (searchQuery) templates = templates.filter(t => templateMatchesSearch(t, searchQuery));

  area.innerHTML = `
    <div class="topic-heading">
      <h2>${escapeHtml(cat.name)}</h2>
      <p>${escapeHtml(cat.description || '')}</p>
    </div>
    <div class="placeholder-warning">\u26a0\ufe0f Every <span class="placeholder">[bracketed]</span> and <span class="placeholder">{{mustache}}</span> field must be replaced before sending \u2014 double-check none are left visible in the final email.</div>
    <div class="result-meta">${templates.length} template${templates.length === 1 ? '' : 's'}${searchQuery ? ` matching "${escapeHtml(searchQuery)}"` : ''}</div>
    ${templates.length ? templates.map(t => renderEmailCard(t)).join('') : `
      <div class="no-results">
        <span class="icon">\ud83d\udd0e</span>
        <div>No templates match "<b>${escapeHtml(searchQuery)}</b>" in this category.</div>
      </div>
    `}
  `;

  attachEmailCardListeners(area);
}

function findEmailTemplateGlobal(id) {
  for (const c of emailCategories) {
    const t = c.templates.find(x => x.id === id);
    if (t) return t;
  }
  return null;
}

function attachEmailCardListeners(area) {
  area.querySelectorAll('.email-card').forEach(card => {
    const id = card.getAttribute('data-template-card');
    card.querySelector('.email-card-head').addEventListener('click', () => {
      emailOpenState[id] = !emailOpenState[id];
      card.classList.toggle('open');
    });
  });

  area.querySelectorAll('.variant-tab-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-template');
      const audience = btn.getAttribute('data-audience');
      variantActiveState[id] = audience;
      const card = btn.closest('.email-card');
      card.querySelectorAll('.variant-tab-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-audience') === audience));
      card.querySelectorAll('.variant-pane').forEach(p => p.classList.toggle('active', p.getAttribute('data-audience') === audience));
    });
  });

  area.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-copy-template');
      const audience = btn.getAttribute('data-copy-audience');
      const t = findEmailTemplateGlobal(id);
      const v = t.variants.find(x => x.audience === audience);
      const text = v.body;
      const done = () => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy body to clipboard'; btn.classList.remove('copied'); }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    });
  });
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) {}
  document.body.removeChild(ta);
}

document.getElementById('emailSearchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  document.getElementById('searchInput').value = searchQuery;
  document.getElementById('emailSearchInput').value = searchQuery;
  document.getElementById('globalHeaderSearch').value = searchQuery;
  renderContent();
  renderEmailContent();
});

renderEmailTopicNav();
renderEmailContent();

document.getElementById('emailsCount').textContent = emailCategories.reduce((a, c) => a + c.templates.length, 0) + ' templates';

const TRAINING_DATA = JSON.parse(document.getElementById('training-data').textContent);
const trainingDays = TRAINING_DATA.days;
let activeDayNum = 1;
const dayCheckState = {};   // "day:idx" -> bool
const dayCompleteState = {}; // day -> bool
const quizAnsweredState = {}; // "day:qIdx" -> selectedIndex
const simRevealState = {};   // "day:idx" -> bool

function topicNameById(id) {
  const t = topics.find(x => x.id === id);
  return t ? t.name : id;
}
function emailCatNameById(id) {
  const c = emailCategories.find(x => x.id === id);
  return c ? c.name : id;
}

function isDayComplete(day) {
  return !!dayCompleteState[day.day];
}

function renderTrainingDayNav() {
  const nav = document.getElementById('trainingDayNav');
  nav.innerHTML = trainingDays.map(d => `
    <div class="day-nav-item ${d.day === activeDayNum ? 'active' : ''} ${isDayComplete(d) ? 'complete' : ''}" data-day="${d.day}">
      <span class="day-nav-badge">${d.day}</span>
      <span>${escapeHtml(d.title)}</span>
    </div>
  `).join('');
  nav.querySelectorAll('.day-nav-item').forEach(el => {
    el.addEventListener('click', () => {
      activeDayNum = parseInt(el.getAttribute('data-day'), 10);
      renderTrainingDayNav();
      renderTrainingContent();
    });
  });
}

function renderQuizCard(day, q, qIdx) {
  const key = `${day.day}:${qIdx}`;
  const answered = quizAnsweredState[key];
  return `
    <div class="quiz-card">
      <div class="quiz-q">Q${qIdx + 1}. ${escapeHtml(q.q)}</div>
      ${q.options.map((opt, oIdx) => {
        let cls = '';
        if (answered !== undefined) {
          if (oIdx === q.answerIndex) cls = 'correct';
          else if (oIdx === answered) cls = 'incorrect';
        }
        return `<button class="quiz-option ${cls}" data-day="${day.day}" data-qidx="${qIdx}" data-oidx="${oIdx}">${escapeHtml(opt)}</button>`;
      }).join('')}
      <div class="quiz-explanation ${answered !== undefined ? 'show' : ''}" id="quiz-exp-${day.day}-${qIdx}">${escapeHtml(q.explanation)}</div>
    </div>
  `;
}

function renderTrainingContent() {
  const area = document.getElementById('trainingContentArea');
  const day = trainingDays.find(d => d.day === activeDayNum);

  const readingHtml = `
    ${(day.sopTopics && day.sopTopics.length) || (day.emailCats && day.emailCats.length) ? `
      <div class="train-section">
        <div class="train-section-title">\ud83d\udcd6 Required Reading</div>
        <div class="reading-pills">
          ${(day.sopTopics || []).map(id => `<button class="reading-pill" data-jump-sop="${id}">\ud83d\udcc1 ${escapeHtml(topicNameById(id))} SOP \u2192</button>`).join('')}
          ${(day.emailCats || []).map(id => `<button class="reading-pill email" data-jump-email="${id}">\u2709\ufe0f ${escapeHtml(emailCatNameById(id))} Templates \u2192</button>`).join('')}
        </div>
      </div>
    ` : ''}
  `;

  const conceptsHtml = (day.keyConcepts && day.keyConcepts.length) ? `
    <div class="train-section">
      <div class="train-section-title">\ud83d\udca1 Key Concepts</div>
      ${day.keyConcepts.map(c => `
        <div class="concept-card">
          <div class="concept-card-title">${escapeHtml(c.title)}</div>
          <ul>${c.points.map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul>
        </div>
      `).join('')}
    </div>
  ` : '';

  const checklistHtml = (day.checklist && day.checklist.length) ? `
    <div class="train-section">
      <div class="train-section-title">\u2705 Checklist</div>
      <div class="day-checklist">
        ${day.checklist.map((item, i) => {
          const key = `${day.day}:${i}`;
          const done = dayCheckState[key];
          return `
            <div class="check-item ${done ? 'done' : ''}" data-check-key="${key}">
              <div class="check-box"></div>
              <div class="check-text">${escapeHtml(item)}</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  ` : '';

  const quizHtml = (day.quiz && day.quiz.length) ? `
    <div class="train-section">
      <div class="train-section-title">\ud83e\udde0 Knowledge Check</div>
      ${day.quiz.map((q, i) => renderQuizCard(day, q, i)).join('')}
    </div>
  ` : '';

  const simHtml = (day.simulationCases && day.simulationCases.length) ? `
    <div class="train-section">
      <div class="train-section-title">\ud83c\udfaf Simulation Cases</div>
      ${day.simulationCases.map((s, i) => {
        const key = `${day.day}:${i}`;
        const revealed = simRevealState[key];
        return `
          <div class="sim-card">
            <div class="sim-scenario"><b>Case ${i + 1}:</b> ${escapeHtml(s.scenario)}</div>
            <button class="sim-reveal-btn" data-sim-key="${key}">${revealed ? 'Hide' : 'Reveal'} correct approach</button>
            <div class="sim-answer ${revealed ? 'show' : ''}" id="sim-answer-${day.day}-${i}">${escapeHtml(s.answer)}</div>
          </div>
        `;
      }).join('')}
    </div>
  ` : '';

  area.innerHTML = `
    <div class="day-header">
      <div class="day-label">Day ${day.day} of ${trainingDays.length}</div>
      <h2>${escapeHtml(day.title)}</h2>
      <div class="day-focus">${escapeHtml(day.focus)}</div>
    </div>
    <div class="train-section">
      <div class="train-section-title">\ud83c\udfaf Learning Objectives</div>
      <ul class="objectives-list">${(day.objectives || []).map(o => `<li>${escapeHtml(o)}</li>`).join('')}</ul>
    </div>
    ${readingHtml}
    ${conceptsHtml}
    ${checklistHtml}
    ${quizHtml}
    ${simHtml}
    <button class="day-complete-btn ${isDayComplete(day) ? 'done' : ''}" id="dayCompleteBtn">
      ${isDayComplete(day) ? '\u2713 Day Complete' : 'Mark Day Complete'}
    </button>
  `;

  // reading pill jump handlers
  area.querySelectorAll('[data-jump-sop]').forEach(btn => {
    btn.addEventListener('click', () => jumpToSopTopic(btn.getAttribute('data-jump-sop')));
  });
  area.querySelectorAll('[data-jump-email]').forEach(btn => {
    btn.addEventListener('click', () => jumpToEmailCategory(btn.getAttribute('data-jump-email')));
  });

  // checklist toggling
  area.querySelectorAll('.check-item').forEach(item => {
    item.addEventListener('click', () => {
      const key = item.getAttribute('data-check-key');
      dayCheckState[key] = !dayCheckState[key];
      item.classList.toggle('done');
    });
  });

  // quiz answer selection
  area.querySelectorAll('.quiz-option').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = parseInt(btn.getAttribute('data-day'), 10);
      const qIdx = parseInt(btn.getAttribute('data-qidx'), 10);
      const oIdx = parseInt(btn.getAttribute('data-oidx'), 10);
      quizAnsweredState[`${d}:${qIdx}`] = oIdx;
      renderTrainingContent();
    });
  });

  // simulation reveal toggling
  area.querySelectorAll('.sim-reveal-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-sim-key');
      simRevealState[key] = !simRevealState[key];
      renderTrainingContent();
    });
  });

  // mark day complete
  const completeBtn = document.getElementById('dayCompleteBtn');
  completeBtn.addEventListener('click', () => {
    dayCompleteState[day.day] = !dayCompleteState[day.day];
    renderTrainingDayNav();
    renderTrainingContent();
  });
}

renderTrainingDayNav();
renderTrainingContent();

document.getElementById('trainingCount').textContent = trainingDays.length + ' days';

/* =========================================================
   INCENTIVE CRITERIA TAB
   ========================================================= */
const INCENTIVE_DATA = JSON.parse(document.getElementById('incentive-data').textContent);
const incentiveMonths = INCENTIVE_DATA.months;
let activeIncentiveMonthId = (incentiveMonths.find(m => m.isCurrent) || incentiveMonths[0]).id;
const screenshotGalleryOpenState = {};

function renderIncentiveMonthNav() {
  const nav = document.getElementById('incentiveMonthNav');
  nav.innerHTML = incentiveMonths.map(m => `
    <div class="incentive-month-item ${m.id === activeIncentiveMonthId ? 'active' : ''}" data-month="${m.id}">
      ${escapeHtml(m.month)} ${m.isCurrent ? '<span class="cur-tag">CURRENT</span>' : ''}
    </div>
  `).join('');
  nav.querySelectorAll('.incentive-month-item').forEach(el => {
    el.addEventListener('click', () => {
      activeIncentiveMonthId = el.getAttribute('data-month');
      renderIncentiveMonthNav();
      renderIncentiveContent();
    });
  });
}

function renderIncentiveTable(table) {
  return `
    <div class="incentive-table-wrap">
      <table class="incentive-table">
        <thead><tr>${table.columns.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
        <tbody>
          ${table.rows.map(row => `<tr>${row.map((cell, i) => `<td class="${i > 0 && i % 2 === 0 ? 'amt-cell' : ''}">${escapeHtml(cell)}</td>`).join('')}</tr>`).join('')}
          ${table.totalRow ? `<tr class="total-row">${table.totalRow.map(cell => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>` : ''}
        </tbody>
      </table>
    </div>
  `;
}

function renderIncentiveContent() {
  const area = document.getElementById('incentiveContentArea');
  const m = incentiveMonths.find(x => x.id === activeIncentiveMonthId);
  const isGalleryOpen = !!screenshotGalleryOpenState[m.id];

  area.innerHTML = `
    <div class="incentive-header-card">
      <div class="team-name">${escapeHtml(m.team)}</div>
      <h3>${escapeHtml(m.kpiTable.title)}</h3>
    </div>
    ${renderIncentiveTable(m.kpiTable)}
    ${m.specialIncentives.map(si => `
      <div class="special-incentive-card">
        <h4>${escapeHtml(si.title)}</h4>
        ${renderIncentiveTable(si)}
      </div>
    `).join('')}
    ${m.screenshots && m.screenshots.length ? `
      <div class="screenshot-toggle" id="screenshotToggle">\ud83d\uddbc\ufe0f ${isGalleryOpen ? 'Hide' : 'View'} original screenshots</div>
      <div class="screenshot-gallery ${isGalleryOpen ? 'open' : ''}" id="screenshotGallery">
        ${m.screenshots.map(s => `
          <figure>
            <img src="data:image/png;base64,${s.data}" alt="${escapeHtml(s.label)}">
            <figcaption>${escapeHtml(s.label)}</figcaption>
          </figure>
        `).join('')}
      </div>
    ` : ''}
  `;

  const toggle = document.getElementById('screenshotToggle');
  if (toggle) {
    toggle.addEventListener('click', () => {
      screenshotGalleryOpenState[m.id] = !screenshotGalleryOpenState[m.id];
      renderIncentiveContent();
    });
  }
}

renderIncentiveMonthNav();
renderIncentiveContent();

document.getElementById('incentiveCount').textContent = incentiveMonths.length + ' month' + (incentiveMonths.length === 1 ? '' : 's');

</script>

</body>
</html>
